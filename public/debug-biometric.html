<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Biometric</title>
<style>
body { font-family: monospace; padding: 20px; background: #111; color: #0f0; font-size: 13px; }
.ok  { color: #2ecc71; } .err { color: #e74c3c; } .warn{ color: #f39c12; }
h2   { color: #4f8ef7; }
pre  { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 4px 0; }
button { padding: 12px 20px; background: #4f8ef7; color: white; border: none; border-radius: 8px; font-size: 15px; margin: 8px 4px; cursor: pointer; }
</style>
</head>
<body>
<h2>🔐 Debug Biometric v2</h2>
<div id="out"></div>
<button onclick="runCheck()">▶ Jalankan Cek</button>
<button onclick="testPlugin('BiometricAuthNative')">🧪 Test BiometricAuthNative</button>
<button onclick="testPlugin('BiometricAuth')">🧪 Test BiometricAuth</button>

<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@8/dist/capacitor.js"></script>
<script src="capacitor-bridge.js"></script>
<script>
const out = document.getElementById("out");
function log(msg, cls) {
  const d = document.createElement("pre");
  d.className = cls || "";
  d.textContent = msg;
  out.appendChild(d);
}

async function runCheck() {
  out.innerHTML = "";
  log("=== CAPACITOR ===");
  log("window.Capacitor: " + !!window.Capacitor, window.Capacitor ? "ok" : "err");
  if (!window.Capacitor) return;

  log("isNativePlatform(): " + window.Capacitor.isNativePlatform?.(), window.Capacitor.isNativePlatform?.() ? "ok" : "err");
  log("getPlatform(): " + window.Capacitor.getPlatform?.());
  log("isPluginAvailable('BiometricAuth'): " + window.Capacitor.isPluginAvailable?.("BiometricAuth"));
  log("isPluginAvailable('BiometricAuthNative'): " + window.Capacitor.isPluginAvailable?.("BiometricAuthNative"));

  log("\n=== PLUGINS ===");
  const P = window.Capacitor.Plugins || {};
  log("Semua plugin: " + Object.keys(P).join(", "));
  log("BiometricAuth ada: "       + !!P.BiometricAuth,       P.BiometricAuth       ? "ok" : "err");
  log("BiometricAuthNative ada: " + !!P.BiometricAuthNative, P.BiometricAuthNative ? "ok" : "err");

  log("\n=== VERDICT ===");
  const isNative = !!window.Capacitor.isNativePlatform?.();
  const plugin = P.BiometricAuthNative || P.BiometricAuth;
  if (isNative && plugin) {
    log("✅ Native + plugin tersedia → siap test checkBiometry()", "ok");
    log("   Plugin yang dipakai: " + (P.BiometricAuthNative ? "BiometricAuthNative" : "BiometricAuth"), "ok");
  } else if (isNative && !plugin) {
    log("❌ Native tapi tidak ada plugin sama sekali", "err");
  } else {
    log("⚠️ Bukan native (platform: " + window.Capacitor.getPlatform?.() + ")", "warn");
  }
}

async function testPlugin(name) {
  const plugin = window.Capacitor?.Plugins?.[name];
  if (!plugin) { log("\n❌ Plugin '" + name + "' tidak ada", "err"); return; }
  log("\n=== TEST " + name + ".checkBiometry() ===");
  try {
    const result = await plugin.checkBiometry();
    log("Hasil: " + JSON.stringify(result, null, 2), result.isAvailable ? "ok" : "err");
    if (!result.isAvailable) {
      log("reason: " + (result.reason || result.errorCode || result.code || "?"), "warn");
    }
  } catch(e) {
    log("Error: " + e.message, "err");
    log("code: " + (e.code || "?"), "warn");
  }
}

setTimeout(runCheck, 600);
</script>
</body>
</html>
